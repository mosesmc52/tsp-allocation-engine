services:
  algo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/mosesmc52/tsp-allocation-engine:${TAG:-latest}
    restart: unless-stopped
    # Values are read from the shell or Compose's optional project .env file.
    # Listing them this way keeps CI builds working when no .env exists.
    environment:
      - AWS_SES_REGION_NAME
      - AWS_DEFAULT_REGION
      - AWS_SES_ACCESS_KEY_ID
      - AWS_SES_SECRET_ACCESS_KEY
      - FROM_ADDRESS
      - TO_ADDRESSES
      - EMAIL_POSITIONS
      - FORCE_REBALANCE
      - TSP_DATA_DIR
    dns:
      - 8.8.8.8
      - 1.1.1.1
